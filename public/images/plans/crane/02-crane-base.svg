<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Smaller square</title>
<desc>Fold in half both ways and open. Fold corner to corner both ways and open. Push the sides in to a smaller square.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<text x="150" y="36" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">in half, both ways</text>
<rect x="40" y="60" width="200" height="200" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<line x1="40" y1="160" x2="240" y2="160" fill="none" stroke="#1c1915" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<line x1="140" y1="60" x2="140" y2="260" fill="none" stroke="#1c1915" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<text x="400" y="36" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">corner to corner</text>
<rect x="300" y="60" width="200" height="200" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<line x1="300" y1="60" x2="500" y2="260" fill="none" stroke="#1c1915" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<line x1="500" y1="60" x2="300" y2="260" fill="none" stroke="#1c1915" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<text x="660" y="36" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">push in</text>
<rect x="580" y="110" width="140" height="140" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<line x1="650" y1="110" x2="650" y2="250" stroke="#111" stroke-width="3"/>
<text x="400" y="420" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">a smaller square, with flaps</text>
</svg>
