<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Other side</title>
<desc>Turn over and repeat the petal fold.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<text x="400" y="40" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">Turn over. Do the petal again</text>
<polygon points="400,70 470,250 400,430 330,250" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<line x1="330" y1="250" x2="470" y2="250" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<line x1="400" y1="70" x2="400" y2="430" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<text x="400" y="470" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">both sides are long diamonds</text>
</svg>
