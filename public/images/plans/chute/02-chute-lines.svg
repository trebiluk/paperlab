<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Lines</title>
<desc>Tape a strip to each corner. Join them on one paperclip.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="280" y="60" width="240" height="180" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<line x1="280" y1="60" x2="220" y2="280" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<line x1="520" y1="60" x2="580" y2="280" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<line x1="280" y1="240" x2="250" y2="320" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<line x1="520" y1="240" x2="550" y2="320" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<rect x="380" y="320" width="40" height="28" fill="#1c1915" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="430" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">a strip from each corner to one clip</text>
</svg>
