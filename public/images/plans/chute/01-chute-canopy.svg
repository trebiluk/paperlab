<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Canopy</title>
<desc>Cut a square. Keep the strips.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<rect x="250" y="80" width="280" height="280" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><rect x="560" y="120" width="40" height="280" fill="#d7c4a8" stroke="#1c1915" stroke-width="4"/><rect x="620" y="120" width="40" height="280" fill="#d7c4a8" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="492" text-anchor="middle" font-size="22" font-family="Georgia, serif" font-weight="700" fill="#1c1915">The square is the canopy. Strips are the lines.</text>
</svg>
