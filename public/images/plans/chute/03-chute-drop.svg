<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Drop</title>
<desc>Drop from the same height three times. A chair only if the teacher says so.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="300" y="80" width="200" height="140" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<line x1="300" y1="220" x2="360" y2="340" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<line x1="500" y1="220" x2="440" y2="340" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<rect x="385" y="340" width="30" height="20" fill="#1c1915" stroke="#1c1915" stroke-width="4"/>
<line x1="400" y1="40" x2="400" y2="70" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="400" y="430" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">drop from the same height. Three times</text>
</svg>
