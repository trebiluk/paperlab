<circle cx="400" cy="140" r="50" fill="#f4e6c8" stroke="#1c1915" stroke-width="4"/><rect x="385" y="190" width="30" height="160" fill="#d7c4a8" stroke="#1c1915" stroke-width="4"/><line x1="370" y1="200" x2="430" y2="200" stroke="#1c1915" stroke-width="3" stroke-dasharray="8 6"/><line x1="370" y1="240" x2="430" y2="240" stroke="#1c1915" stroke-width="3" stroke-dasharray="8 6"/><line x1="370" y1="280" x2="430" y2="280" stroke="#1c1915" stroke-width="3" stroke-dasharray="8 6"/>
<text x="400" y="492" text-anchor="middle" font-size="22" font-family="Georgia, serif" font-weight="700" fill="#1c1915">Tighter roll, or a shorter stem</text>
