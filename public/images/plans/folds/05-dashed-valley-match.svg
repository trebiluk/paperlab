<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">Step 5: Dashed equals valley — match and quiz prove</title>
  <desc id="desc">Match test: a dashed fold line on the board or screen means valley. Name six moves: valley, mountain, crease, fold-and-unfold, collapse, tuck. Pass the fold quiz 3 out of 4.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .label { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#0A0E17; }
      .small { font-family:Arial,Helvetica,sans-serif; font-weight:600; fill:#475569; }
      .crease { stroke:#0A0E17; stroke-width:4; stroke-dasharray:11 9; opacity:.8; stroke-linecap:round; fill:none; }
      .arrow { stroke:#2563EB; stroke-width:7; stroke-linecap:round; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="620" fill="#EEF2F7"/>
  <circle cx="88" cy="76" r="30" fill="#2563EB"/>
  <text x="88" y="88" text-anchor="middle" font-size="30" class="label" fill="#FFFFFF" style="fill:#FFFFFF">5</text>
  <text x="132" y="82" font-size="32" class="label">Dashed = valley match</text>
  <text x="132" y="108" font-size="16" class="small">Board legend · six moves · quiz prove 3/4</text>
  <rect x="56" y="126" width="688" height="410" rx="24" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="3"/>

  <!-- MATCH TEST card (left) -->
  <rect x="80" y="150" width="340" height="260" rx="14" fill="#FFFFFF" stroke="#0A0E17" stroke-width="4"/>
  <rect x="80" y="150" width="340" height="44" rx="14" fill="#2563EB"/>
  <rect x="80" y="180" width="340" height="14" fill="#2563EB"/>
  <text x="250" y="180" text-anchor="middle" font-size="18" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-weight="700">MATCH TEST</text>

  <!-- Mini board/screen with dashed line on scrap -->
  <rect x="120" y="220" width="260" height="140" rx="8" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="3"/>
  <text x="250" y="245" text-anchor="middle" font-size="12" class="small">on board / screen</text>
  <rect x="155" y="255" width="190" height="80" fill="#F8FAFC" stroke="#0A0E17" stroke-width="4"/>
  <!-- THE dashed valley line -->
  <line x1="155" y1="295" x2="345" y2="295" class="crease"/>
  <path d="M250 270 V288" class="arrow"/>

  <text x="250" y="365" text-anchor="middle" font-size="20" class="label" fill="#2563EB" style="fill:#2563EB">dashed = VALLEY</text>
  <text x="250" y="390" text-anchor="middle" font-size="13" class="small">point and say it out loud</text>

  <!-- SIX MOVES card (right) -->
  <rect x="440" y="150" width="280" height="260" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <text x="580" y="180" text-anchor="middle" font-size="16" class="label">SIX MOVES</text>
  <text x="580" y="200" text-anchor="middle" font-size="12" class="small">name on fingers</text>

  <!-- Move chips -->
  <rect x="460" y="215" width="110" height="36" rx="18" fill="#DBEAFE" stroke="#0A0E17" stroke-width="2"/>
  <text x="515" y="239" text-anchor="middle" font-size="13" class="label">valley</text>
  <rect x="590" y="215" width="110" height="36" rx="18" fill="#DBEAFE" stroke="#0A0E17" stroke-width="2"/>
  <text x="645" y="239" text-anchor="middle" font-size="13" class="label">mountain</text>

  <rect x="460" y="262" width="110" height="36" rx="18" fill="#F8FAFC" stroke="#0A0E17" stroke-width="2"/>
  <text x="515" y="286" text-anchor="middle" font-size="13" class="label">crease</text>
  <rect x="590" y="262" width="110" height="36" rx="18" fill="#F8FAFC" stroke="#0A0E17" stroke-width="2"/>
  <text x="645" y="286" text-anchor="middle" font-size="12" class="label">fold-unfold</text>

  <rect x="460" y="309" width="110" height="36" rx="18" fill="#F8FAFC" stroke="#0A0E17" stroke-width="2"/>
  <text x="515" y="333" text-anchor="middle" font-size="13" class="label">collapse</text>
  <rect x="590" y="309" width="110" height="36" rx="18" fill="#F8FAFC" stroke="#0A0E17" stroke-width="2"/>
  <text x="645" y="333" text-anchor="middle" font-size="13" class="label">tuck</text>

  <text x="580" y="380" text-anchor="middle" font-size="12" class="small">valle · montaña OK once</text>

  <!-- QUIZ PROVE bar -->
  <rect x="80" y="430" width="640" height="80" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
  <rect x="100" y="448" width="120" height="44" rx="22" fill="#2563EB"/>
  <text x="160" y="478" text-anchor="middle" font-size="20" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-weight="700">QUIZ</text>
  <text x="420" y="468" text-anchor="middle" font-size="20" class="label">Pass = 3 out of 4</text>
  <text x="420" y="494" text-anchor="middle" font-size="14" class="small">Point to the diagram · say the move · prove the match</text>

  <text x="400" y="575" text-anchor="middle" font-size="18" class="label">Prove the match — not a finished origami prop</text>
</svg>
