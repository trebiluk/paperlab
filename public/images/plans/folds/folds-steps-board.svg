<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="440" viewBox="0 0 1680 440" role="img" aria-labelledby="title desc">
  <title id="title">PaperLab folds: five steps — scrap techniques board</title>
  <desc id="desc">Five-panel board strip: scrap flat, valley toward you, mountain away, fold-and-unfold plus tuck, dashed equals valley match quiz.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .label { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#0A0E17; }
      .small { font-family:Arial,Helvetica,sans-serif; font-weight:600; fill:#475569; }
      .crease { stroke:#0A0E17; stroke-width:3; stroke-dasharray:8 6; opacity:.75; stroke-linecap:round; fill:none; }
      .arrow { stroke:#2563EB; stroke-width:5; stroke-linecap:round; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="1680" height="440" fill="#EEF2F7"/>
  <text x="56" y="48" font-size="26" class="label">PAPERLAB FOLDS — SCRAP TECHNIQUES (WAVE 1 #1)</text>
  <text x="1624" y="48" text-anchor="end" font-size="16" class="small">same scrap silhouette · dashed = valley</text>

  <rect x="32" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="362" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="692" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="1022" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="1352" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>

  <circle cx="66" cy="108" r="25" fill="#2563EB"/><text x="66" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">1</text>
  <circle cx="396" cy="108" r="25" fill="#2563EB"/><text x="396" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">2</text>
  <circle cx="726" cy="108" r="25" fill="#2563EB"/><text x="726" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">3</text>
  <circle cx="1056" cy="108" r="25" fill="#2563EB"/><text x="1056" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">4</text>
  <circle cx="1386" cy="108" r="25" fill="#2563EB"/><text x="1386" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">5</text>

  <!-- P1: scrap flat -->
  <text x="104" y="114" font-size="18" class="label">Scrap flat</text>
  <rect x="100" y="175" width="140" height="100" fill="#F8FAFC" stroke="#0A0E17" stroke-width="4"/>
  <text x="170" y="235" text-anchor="middle" font-size="16" class="label">SCRAP</text>
  <circle cx="100" cy="225" r="6" fill="#2563EB"/>
  <circle cx="240" cy="225" r="6" fill="#2563EB"/>
  <path d="M85 225 H95" class="arrow"/>
  <path d="M255 225 H245" class="arrow"/>
  <text x="170" y="320" text-anchor="middle" font-size="13" class="label">LEFT · RIGHT edge</text>
  <text x="170" y="345" text-anchor="middle" font-size="12" class="small">scrap only</text>
  <text x="170" y="365" text-anchor="middle" font-size="12" class="small">save good sheet</text>

  <!-- P2: valley toward -->
  <text x="434" y="114" font-size="18" class="label">Valley toward</text>
  <rect x="430" y="220" width="140" height="70" fill="#DBEAFE" stroke="#0A0E17" stroke-width="4"/>
  <line x1="430" y1="220" x2="570" y2="220" class="crease"/>
  <rect x="430" y="155" width="140" height="65" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M500 170 V210" class="arrow"/>
  <polyline points="460,250 500,275 540,250" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="500" y="320" text-anchor="middle" font-size="13" class="label">VALLEY · V</text>
  <text x="500" y="345" text-anchor="middle" font-size="12" class="small">toward you</text>
  <text x="500" y="365" text-anchor="middle" font-size="12" class="small">pliegue en valle</text>

  <!-- P3: mountain away -->
  <text x="764" y="114" font-size="18" class="label">Mountain away</text>
  <polygon points="760,300 820,200 880,300" fill="#F8FAFC" stroke="#0A0E17" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="760,300 820,200 820,320" fill="#DBEAFE" stroke="#0A0E17" stroke-width="3" stroke-linejoin="round" opacity=".85"/>
  <circle cx="820" cy="200" r="5" fill="#2563EB"/>
  <path d="M820 175 V195" class="arrow"/>
  <text x="820" y="340" text-anchor="middle" font-size="13" class="label">MOUNTAIN</text>
  <text x="820" y="360" text-anchor="middle" font-size="12" class="small">same crease · flip</text>
  <text x="820" y="380" text-anchor="middle" font-size="12" class="small">montaña</text>

  <!-- P4: fold-unfold + tuck -->
  <text x="1094" y="114" font-size="18" class="label">Fold-unfold · tuck</text>
  <rect x="1085" y="160" width="80" height="55" fill="#F8FAFC" stroke="#0A0E17" stroke-width="3"/>
  <line x1="1085" y1="187" x2="1165" y2="187" class="crease"/>
  <text x="1125" y="235" text-anchor="middle" font-size="11" class="small">unfold</text>
  <rect x="1195" y="160" width="80" height="55" fill="#F8FAFC" stroke="#0A0E17" stroke-width="3"/>
  <polygon points="1195,160 1225,160 1195,190" fill="#DBEAFE" stroke="#0A0E17" stroke-width="2"/>
  <polygon points="1275,160 1245,160 1275,190" fill="#DBEAFE" stroke="#0A0E17" stroke-width="2"/>
  <line x1="1195" y1="190" x2="1275" y2="190" stroke="#2563EB" stroke-width="3"/>
  <text x="1235" y="235" text-anchor="middle" font-size="11" class="small">pocket</text>
  <rect x="1125" y="255" width="100" height="50" fill="#F8FAFC" stroke="#0A0E17" stroke-width="3"/>
  <rect x="1125" y="280" width="100" height="25" fill="#DBEAFE" stroke="#0A0E17" stroke-width="2"/>
  <path d="M1175 250 V275" class="arrow"/>
  <text x="1170" y="335" text-anchor="middle" font-size="13" class="label">TUCK + pinch</text>
  <text x="1170" y="355" text-anchor="middle" font-size="12" class="small">collapse optional</text>
  <text x="1170" y="375" text-anchor="middle" font-size="12" class="small">new scrap</text>

  <!-- P5: dashed = valley match -->
  <text x="1424" y="114" font-size="18" class="label">Match · quiz</text>
  <rect x="1420" y="155" width="160" height="100" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="1440" y="175" width="120" height="55" fill="#F8FAFC" stroke="#0A0E17" stroke-width="3"/>
  <line x1="1440" y1="202" x2="1560" y2="202" class="crease"/>
  <text x="1500" y="275" text-anchor="middle" font-size="13" class="label" fill="#2563EB" style="fill:#2563EB">dashed = valley</text>
  <rect x="1425" y="290" width="150" height="36" rx="18" fill="#2563EB"/>
  <text x="1500" y="314" text-anchor="middle" font-size="16" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-weight="700">QUIZ 3/4</text>
  <text x="1500" y="350" text-anchor="middle" font-size="12" class="small">six moves named</text>
  <text x="1500" y="370" text-anchor="middle" font-size="12" class="small">prove the match</text>

  <text x="840" y="420" text-anchor="middle" font-size="15" class="small">Rectangular scrap throughout · dashed = valley · fat labels on creases · no mystery diagonals</text>
</svg>
