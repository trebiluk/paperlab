<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">Step 4: Fold-and-unfold, tuck, and collapse</title>
  <desc id="desc">New scrap: fold edge to edge, press, unfold (fold-and-unfold). Fold two corners in to make a pocket. Tuck a flap into the pocket. Optional: pinch several creases so the middle sinks (collapse).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .label { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#0A0E17; }
      .small { font-family:Arial,Helvetica,sans-serif; font-weight:600; fill:#475569; }
      .crease { stroke:#0A0E17; stroke-width:3; stroke-dasharray:8 6; opacity:.75; stroke-linecap:round; fill:none; }
      .arrow { stroke:#2563EB; stroke-width:5; stroke-linecap:round; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="620" fill="#EEF2F7"/>
  <circle cx="88" cy="76" r="30" fill="#2563EB"/>
  <text x="88" y="88" text-anchor="middle" font-size="30" class="label" fill="#FFFFFF" style="fill:#FFFFFF">4</text>
  <text x="132" y="82" font-size="30" class="label">Fold-and-unfold + tuck</text>
  <text x="132" y="108" font-size="16" class="small">New scrap · crease · pocket · tuck · collapse pinch</text>
  <rect x="56" y="126" width="688" height="410" rx="24" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="3"/>

  <!-- ===== A: fold-and-unfold ===== -->
  <rect x="76" y="148" width="200" height="240" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <text x="176" y="175" text-anchor="middle" font-size="14" class="label">A · FOLD-AND-UNFOLD</text>
  <!-- scrap flat with mid crease after unfold -->
  <rect x="106" y="200" width="140" height="100" fill="#F8FAFC" stroke="#0A0E17" stroke-width="4"/>
  <line x1="106" y1="250" x2="246" y2="250" class="crease"/>
  <path d="M176 215 V240" class="arrow"/>
  <text x="176" y="325" text-anchor="middle" font-size="12" class="label">edge to edge</text>
  <text x="176" y="345" text-anchor="middle" font-size="12" class="small">press · then UNFOLD</text>
  <text x="176" y="365" text-anchor="middle" font-size="12" class="label" fill="#2563EB" style="fill:#2563EB">crease stays</text>

  <!-- ===== B: two corners → pocket ===== -->
  <rect x="292" y="148" width="200" height="240" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <text x="392" y="175" text-anchor="middle" font-size="14" class="label">B · CORNERS IN</text>
  <!-- scrap with two top corners folded in -->
  <rect x="322" y="200" width="140" height="100" fill="#F8FAFC" stroke="#0A0E17" stroke-width="4"/>
  <!-- left corner triangle -->
  <polygon points="322,200 372,200 322,250" fill="#DBEAFE" stroke="#0A0E17" stroke-width="3" stroke-linejoin="round"/>
  <!-- right corner triangle -->
  <polygon points="462,200 412,200 462,250" fill="#DBEAFE" stroke="#0A0E17" stroke-width="3" stroke-linejoin="round"/>
  <!-- pocket lip hint -->
  <line x1="322" y1="250" x2="462" y2="250" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <path d="M347 215 L332 230" class="arrow"/>
  <path d="M437 215 L452 230" class="arrow"/>
  <text x="392" y="325" text-anchor="middle" font-size="12" class="label">two corners in</text>
  <text x="392" y="345" text-anchor="middle" font-size="12" class="small">makes a POCKET</text>
  <text x="392" y="365" text-anchor="middle" font-size="12" class="label" fill="#2563EB" style="fill:#2563EB">POCKET LIP</text>

  <!-- ===== C: tuck ===== -->
  <rect x="508" y="148" width="220" height="240" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <text x="618" y="175" text-anchor="middle" font-size="14" class="label">C · TUCK</text>
  <!-- pocket packet -->
  <rect x="548" y="205" width="140" height="90" fill="#F8FAFC" stroke="#0A0E17" stroke-width="4"/>
  <rect x="548" y="245" width="140" height="50" fill="#DBEAFE" stroke="#0A0E17" stroke-width="3"/>
  <line x1="553" y1="245" x2="683" y2="245" stroke="#2563EB" stroke-width="4"/>
  <!-- flap being tucked under lip -->
  <polygon points="578,205 618,235 658,205" fill="#FFFFFF" stroke="#0A0E17" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="588,245 618,268 648,245" fill="none" stroke="#0A0E17" stroke-width="2" stroke-dasharray="5 4" opacity=".6"/>
  <path d="M618 195 V235" class="arrow"/>
  <text x="618" y="325" text-anchor="middle" font-size="12" class="label">flap INTO pocket</text>
  <text x="618" y="345" text-anchor="middle" font-size="12" class="small">that is a TUCK</text>
  <text x="618" y="365" text-anchor="middle" font-size="12" class="label" fill="#2563EB" style="fill:#2563EB">meter · tuck</text>

  <!-- ===== D: collapse (optional strip) ===== -->
  <rect x="76" y="402" width="652" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <text x="100" y="430" font-size="14" class="label">D · COLLAPSE (optional pinch)</text>
  <!-- flat scrap with several crease lines -->
  <rect x="280" y="420" width="160" height="70" fill="#F8FAFC" stroke="#0A0E17" stroke-width="3"/>
  <line x1="280" y1="455" x2="440" y2="455" class="crease"/>
  <line x1="360" y1="420" x2="360" y2="490" class="crease"/>
  <line x1="300" y1="430" x2="420" y2="480" class="crease"/>
  <line x1="420" y1="430" x2="300" y2="480" class="crease"/>
  <!-- arrows pinching middle in -->
  <path d="M250 455 H275" class="arrow"/>
  <path d="M470 455 H445" class="arrow"/>
  <path d="M360 405 V418" class="arrow"/>
  <circle cx="360" cy="455" r="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="520" y="448" font-size="13" class="label">pinch several creases</text>
  <text x="520" y="470" font-size="13" class="small">middle sinks · COLLAPSE</text>
  <text x="520" y="492" font-size="12" class="label" fill="#2563EB" style="fill:#2563EB">colapsar</text>

  <text x="400" y="575" text-anchor="middle" font-size="17" class="label">Same scrap silhouette · labeled moves · no mystery cuts</text>
</svg>
