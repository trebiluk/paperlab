<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">Step 2: Valley fold toward you</title>
  <desc id="desc">Fold the top edge of the scrap toward you. Line edges up and press. Leave folded so you see a V valley crease. Label: VALLEY / pliegue en valle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .label { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#0A0E17; }
      .small { font-family:Arial,Helvetica,sans-serif; font-weight:600; fill:#475569; }
      .crease { stroke:#0A0E17; stroke-width:4; stroke-dasharray:11 9; opacity:.75; stroke-linecap:round; fill:none; }
      .arrow { stroke:#2563EB; stroke-width:8; stroke-linecap:round; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="620" fill="#EEF2F7"/>
  <circle cx="88" cy="76" r="30" fill="#2563EB"/>
  <text x="88" y="88" text-anchor="middle" font-size="30" class="label" fill="#FFFFFF" style="fill:#FFFFFF">2</text>
  <text x="132" y="82" font-size="32" class="label">Valley fold toward you</text>
  <text x="132" y="108" font-size="16" class="small">Top edge toward viewer · leave folded · see the V</text>
  <rect x="56" y="126" width="688" height="410" rx="24" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="3"/>

  <!-- Bottom half of scrap (stays on desk) -->
  <rect x="250" y="290" width="300" height="110" fill="#F8FAFC" stroke="#0A0E17" stroke-width="5" stroke-linejoin="round"/>

  <!-- Top half folded TOWARD viewer — overlaps bottom as flap tint -->
  <rect x="250" y="290" width="300" height="110" fill="#DBEAFE" stroke="#0A0E17" stroke-width="5" stroke-linejoin="round" opacity="0.95"/>

  <!-- Valley crease across middle (dashed = valley) -->
  <line x1="250" y1="290" x2="550" y2="290" class="crease"/>

  <!-- Press marks on crease -->
  <g stroke="#0A0E17" stroke-width="3" stroke-linecap="round">
    <line x1="320" y1="278" x2="332" y2="302"/>
    <line x1="360" y1="278" x2="372" y2="302"/>
    <line x1="400" y1="278" x2="412" y2="302"/>
    <line x1="440" y1="278" x2="452" y2="302"/>
    <line x1="480" y1="278" x2="492" y2="302"/>
  </g>

  <!-- Ghost of where top edge was (before fold) -->
  <rect x="250" y="180" width="300" height="110" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 8" opacity="0.7"/>
  <text x="400" y="245" text-anchor="middle" font-size="14" class="small">top edge was here</text>

  <!-- Arrow: top edge TOWARD YOU (down toward viewer) -->
  <path d="M400 200 V275" class="arrow"/>
  <text x="520" y="230" font-size="15" class="label" fill="#2563EB" style="fill:#2563EB">TOWARD YOU</text>

  <!-- Big VALLEY label with V icon -->
  <rect x="280" y="320" width="240" height="64" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
  <text x="400" y="348" text-anchor="middle" font-size="22" class="label" fill="#2563EB" style="fill:#2563EB">VALLEY</text>
  <text x="400" y="372" text-anchor="middle" font-size="13" class="small">like a V · pliegue en valle</text>

  <!-- V icon callout left -->
  <g transform="translate(140,300)">
    <polyline points="20,10 50,55 80,10" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="85" text-anchor="middle" font-size="14" class="label">V</text>
  </g>

  <!-- Edges lined up callout -->
  <text x="620" y="355" text-anchor="middle" font-size="13" class="label">edges lined up</text>
  <text x="620" y="375" text-anchor="middle" font-size="13" class="small">press with fingernail</text>

  <text x="400" y="575" text-anchor="middle" font-size="18" class="label">Leave folded · see the V · dashed crease = valley</text>
</svg>
