<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>The gap</title>
<desc>Two books with a gap as wide as two hands.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="80" y="180" width="140" height="80" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="560" y="180" width="140" height="80" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<line x1="220" y1="220" x2="560" y2="220" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<text x="400" y="360" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">two books. A gap as wide as two hands</text>
</svg>
