<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Flat sheet</title>
<desc>Lay one sheet flat. Put a glue stick in the middle.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="80" y="200" width="120" height="60" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="600" y="200" width="120" height="60" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="200" y="210" width="400" height="16" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="370" y="170" width="60" height="40" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="360" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">flat sheet. Glue stick in the middle</text>
