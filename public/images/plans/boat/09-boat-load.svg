<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Load</title>
<desc>Add one clip at a time in the middle. Stop when water comes in.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<polygon points="200,190 600,190 540,300 260,300" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<rect x="370" y="220" width="18" height="28" fill="#1c1915" stroke="#1c1915" stroke-width="4"/>
<rect x="400" y="220" width="18" height="28" fill="#1c1915" stroke="#1c1915" stroke-width="4"/>
<rect x="430" y="220" width="18" height="28" fill="#1c1915" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="420" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">one clip at a time, in the middle</text>
</svg>
