<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>One change</title>
<desc>Change one thing only, such as both wing tips up a little. Fly three more times.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<polygon points="180,180 420,230 180,280" fill="#fffdf6" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<path d="M260 230 L460 300" fill="none" stroke="#1c1915" stroke-width="4"/>
<path d="M430 292 L470 318" fill="none" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="380" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">one change: both tips up a little</text>
<text x="400" y="450" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">then three more throws</text>
</svg>
