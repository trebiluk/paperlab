<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Three throws</title>
<desc>Stand at the start. Throw gently toward the tape. Three times.</desc>
<rect width="800" height="520" fill="#ffffff"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
  </marker>
</defs>
<rect x="70" y="250" width="14" height="120" fill="#111"/>
<text x="77" y="400" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">start</text>
<polygon points="160,280 250,250 250,330" fill="#fffdf6" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
<line x1="270" y1="290" x2="520" y2="290" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="560" y="200" width="10" height="180" fill="#111"/>
<text x="620" y="400" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">tape</text>
<text x="400" y="460" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">three gentle throws</text>
</svg>
