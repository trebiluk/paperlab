<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Nose folds</title>
<desc>Fold both top corners to the middle line. Then fold the new edges to the middle line.</desc>
<rect width="800" height="520" fill="#ffffff"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
  </marker>
</defs>
<text x="200" y="44" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">1  Corners to the middle</text>
<rect x="80" y="70" width="220" height="300" fill="#fffdf6" stroke="#111111" stroke-width="4"/>
<line x1="190" y1="70" x2="190" y2="370" stroke="#111" stroke-width="3"/>
<line x1="80" y1="70" x2="190" y2="160" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<line x1="300" y1="70" x2="190" y2="160" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<line x1="100" y1="90" x2="170" y2="145" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="280" y1="90" x2="210" y2="145" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="560" y="44" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">2  New edges to the middle</text>
<polygon points="470,200 670,200 670,400 470,400" fill="#fffdf6" stroke="#111" stroke-width="4"/>
<polygon points="470,200 570,90 670,200" fill="#fffdf6" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
<line x1="570" y1="90" x2="570" y2="400" stroke="#111" stroke-width="3"/>
<line x1="500" y1="160" x2="555" y2="175" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="640" y1="160" x2="585" y2="175" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
