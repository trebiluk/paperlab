<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Center crease</title>
<desc>Fold a tall sheet in half the long way, then open it. The middle line stays.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<text x="200" y="48" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">1  Fold</text>
<rect x="90" y="80" width="200" height="300" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<line x1="190" y1="80" x2="190" y2="380" fill="none" stroke="#1c1915" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<line x1="110" y1="200" x2="175" y2="200" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="190" y="430" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">left edge to right edge</text>
<text x="560" y="48" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">2  Open</text>
<rect x="450" y="80" width="200" height="300" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<line x1="550" y1="80" x2="550" y2="380" stroke="#111" stroke-width="3"/>
<text x="550" y="430" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">the middle line stays</text>
</svg>
