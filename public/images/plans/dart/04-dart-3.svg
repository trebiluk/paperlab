<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Wings</title>
<desc>Fold in half so the point stays outside. Fold one wing down. Flip. Fold the other wing to match.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<text x="200" y="48" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">1  Fold in half</text>
<polygon points="120,90 280,90 200,160" fill="#fffdf6" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<polygon points="140,160 260,160 260,400 140,400" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<text x="200" y="450" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">point stays outside</text>
<text x="560" y="48" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">2  Wings down, match them</text>
<polygon points="430,220 700,250 430,280" fill="#fffdf6" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<polygon points="500,250 700,300 500,330" fill="#fffdf6" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<line x1="560" y1="200" x2="560" y2="245" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="600" y="420" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">one wing, then the other</text>
</svg>
