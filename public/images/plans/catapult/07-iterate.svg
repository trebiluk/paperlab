<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>One change</title><desc>Make the arm longer or the pocket deeper, then shoot three more times.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/></marker></defs>
<rect x="140" y="220" width="200" height="22" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><line x1="360" y1="230" x2="460" y2="230" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><rect x="500" y="210" width="240" height="22" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><text x="400" y="360" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">longer arm, or a deeper pocket</text>
</svg>
