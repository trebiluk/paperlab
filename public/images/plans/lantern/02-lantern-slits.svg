<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Slits</title>
<desc>Fold in half. Cut slits from the fold. Stop before the open edge.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="220" y="80" width="360" height="280" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<line x1="400" y1="80" x2="400" y2="360" fill="none" stroke="#1c1915" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<line x1="300" y1="140" x2="400" y2="140" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<line x1="300" y1="190" x2="400" y2="190" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<line x1="300" y1="240" x2="400" y2="240" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<line x1="300" y1="290" x2="400" y2="290" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<text x="400" y="450" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">cut from the fold. Stop before the edge</text>
</svg>
