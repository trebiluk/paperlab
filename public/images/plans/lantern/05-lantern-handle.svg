<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Handle</title>
<desc>Tape a leftover strip to both ends.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<polygon points="300,180 500,150 540,210 340,240" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<polygon points="340,240 540,210 500,330 300,300" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<polygon points="250,160 300,180 300,300 250,320" fill="none" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<line x1="270" y1="150" x2="270" y2="340" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<text x="400" y="440" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">a strip handle. Still no flame</text>
</svg>
