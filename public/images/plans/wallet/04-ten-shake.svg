<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">Step 4: Ten-shake prove over the desk</title>
  <desc id="desc">Hold the wallet shut over the desk, not the aisle. Shake ten times. Pass means all three cards stay. Fail modes: side slip, flap open, or pocket too shallow. This frame shows the test — prove first, no alias name-first.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .label { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#0A0E17; }
      .small { font-family:Arial,Helvetica,sans-serif; font-weight:600; fill:#475569; }
      .arrow { stroke:#2563EB; stroke-width:8; stroke-linecap:round; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="620" fill="#EEF2F7"/>
  <circle cx="88" cy="76" r="30" fill="#2563EB"/>
  <text x="88" y="88" text-anchor="middle" font-size="30" class="label" fill="#FFFFFF" style="fill:#FFFFFF">4</text>
  <text x="132" y="82" font-size="30" class="label">10-shake over desk</text>
  <text x="132" y="108" font-size="16" class="small">Prove frame · hold shut · count ten · no name-first</text>
  <rect x="56" y="126" width="688" height="410" rx="24" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="3"/>

  <!-- DESK surface -->
  <rect x="140" y="430" width="520" height="70" rx="10" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="3"/>
  <text x="400" y="472" text-anchor="middle" font-size="16" class="label">DESK · not aisle</text>

  <!-- Closed billfold (same silhouette as D2 closed) — NO alias dominating -->
  <g transform="translate(280,220)">
    <rect x="0" y="0" width="240" height="120" fill="#F8FAFC" stroke="#0A0E17" stroke-width="5" stroke-linejoin="round"/>
    <!-- cover closed -->
    <rect x="0" y="0" width="240" height="70" fill="#DBEAFE" stroke="#0A0E17" stroke-width="4" stroke-linejoin="round"/>
    <!-- hems -->
    <rect x="0" y="0" width="18" height="120" fill="#DBEAFE" stroke="#0A0E17" stroke-width="3"/>
    <rect x="222" y="0" width="18" height="120" fill="#DBEAFE" stroke="#0A0E17" stroke-width="3"/>
    <!-- pocket lip hint -->
    <line x1="24" y1="70" x2="216" y2="70" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
    <!-- three cards peeking as retention check (still inside) -->
    <rect x="50" y="78" width="40" height="28" rx="2" fill="#FEF3C7" stroke="#0A0E17" stroke-width="2"/>
    <rect x="100" y="78" width="40" height="28" rx="2" fill="#FDE68A" stroke="#0A0E17" stroke-width="2"/>
    <rect x="150" y="78" width="40" height="28" rx="2" fill="#FEF3C7" stroke="#0A0E17" stroke-width="2"/>
    <text x="120" y="50" text-anchor="middle" font-size="14" class="label">SHUT</text>
  </g>

  <!-- 10× SHAKE badge -->
  <rect x="290" y="148" width="220" height="50" rx="25" fill="#2563EB"/>
  <text x="400" y="182" text-anchor="middle" font-size="26" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-weight="700">10× SHAKE</text>

  <!-- Shake motion arrows -->
  <path d="M220 260 q-30 -40 0 -80" class="arrow"/>
  <path d="M220 320 q-30 40 0 80" class="arrow"/>
  <path d="M580 260 q30 -40 0 -80" class="arrow"/>
  <path d="M580 320 q30 40 0 80" class="arrow"/>

  <!-- PASS chip -->
  <rect x="70" y="200" width="120" height="70" rx="12" fill="#DCFCE7" stroke="#0A0E17" stroke-width="3"/>
  <text x="130" y="230" text-anchor="middle" font-size="14" class="label">PASS</text>
  <text x="130" y="250" text-anchor="middle" font-size="12" class="small">all 3 cards</text>
  <text x="130" y="266" text-anchor="middle" font-size="12" class="small">stay in</text>

  <!-- Fail modes -->
  <rect x="610" y="175" width="130" height="130" rx="12" fill="#FFFFFF" stroke="#0A0E17" stroke-width="3"/>
  <text x="675" y="200" text-anchor="middle" font-size="13" class="label">FAIL modes</text>
  <text x="675" y="222" text-anchor="middle" font-size="12" class="small">side slip</text>
  <text x="675" y="242" text-anchor="middle" font-size="12" class="small">flap open</text>
  <text x="675" y="262" text-anchor="middle" font-size="12" class="small">pocket too</text>
  <text x="675" y="280" text-anchor="middle" font-size="12" class="small">shallow</text>

  <!-- Prove-first banner -->
  <rect x="200" y="370" width="400" height="36" rx="10" fill="#FEF3C7" stroke="#0A0E17" stroke-width="3"/>
  <text x="400" y="394" text-anchor="middle" font-size="15" class="label">PROVE FIRST · alias after pass</text>

  <text x="400" y="575" text-anchor="middle" font-size="17" class="label">Test the retention — not a renamed finished wallet</text>
</svg>
