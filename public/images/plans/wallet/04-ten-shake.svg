<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Ten shakes</title>
<desc>Hold the closed wallet over the desk and shake it ten times.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="250" y="140" width="300" height="180" rx="6" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<path d="M230 160 q-30 40 10 80" fill="none" stroke="#1c1915" stroke-width="4" marker-end="url(#arr)"/>
<path d="M570 160 q30 40 -10 80" fill="none" stroke="#1c1915" stroke-width="4" marker-end="url(#arr)"/>
<text x="400" y="400" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">over the desk</text>
<text x="400" y="450" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">shake ten times</text>
</svg>
