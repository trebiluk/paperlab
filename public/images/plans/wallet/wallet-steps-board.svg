<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="440" viewBox="0 0 1680 440" role="img" aria-labelledby="title desc">
  <title id="title">PaperLab wallet: five steps — billfold board</title>
  <desc id="desc">Five-panel board strip: portrait valleys, pocket cover hems, load three cards, ten-shake prove over desk, one change and retest.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .label { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#0A0E17; }
      .small { font-family:Arial,Helvetica,sans-serif; font-weight:600; fill:#475569; }
      .crease { stroke:#0A0E17; stroke-width:3; stroke-dasharray:8 6; opacity:.75; stroke-linecap:round; fill:none; }
      .arrow { stroke:#2563EB; stroke-width:5; stroke-linecap:round; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="1680" height="440" fill="#EEF2F7"/>
  <text x="56" y="48" font-size="26" class="label">PAPERLAB WALLET — BILLFOLD (WAVE 1 #2)</text>
  <text x="1624" y="48" text-anchor="end" font-size="16" class="small">same silhouette · prove first · no tape</text>

  <rect x="32" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="362" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="692" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="1022" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="1352" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>

  <circle cx="66" cy="108" r="25" fill="#2563EB"/><text x="66" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">1</text>
  <circle cx="396" cy="108" r="25" fill="#2563EB"/><text x="396" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">2</text>
  <circle cx="726" cy="108" r="25" fill="#2563EB"/><text x="726" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">3</text>
  <circle cx="1056" cy="108" r="25" fill="#2563EB"/><text x="1056" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">4</text>
  <circle cx="1386" cy="108" r="25" fill="#2563EB"/><text x="1386" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">5</text>

  <!-- P1: portrait valleys -->
  <text x="104" y="114" font-size="17" class="label">Portrait valleys</text>
  <rect x="115" y="150" width="110" height="150" fill="#F8FAFC" stroke="#0A0E17" stroke-width="4"/>
  <rect x="115" y="225" width="110" height="75" fill="#DBEAFE" opacity="0.5"/>
  <line x1="170" y1="150" x2="170" y2="300" class="crease"/>
  <line x1="115" y1="225" x2="225" y2="225" class="crease"/>
  <text x="170" y="270" text-anchor="middle" font-size="11" class="label">POCKET</text>
  <text x="170" y="325" text-anchor="middle" font-size="13" class="label">long + mid valley</text>
  <text x="170" y="348" text-anchor="middle" font-size="12" class="small">sheet tall · open</text>
  <text x="170" y="370" text-anchor="middle" font-size="12" class="small">bolsillo zone</text>

  <!-- P2: pocket cover hems -->
  <text x="434" y="114" font-size="17" class="label">Pocket · cover</text>
  <rect x="445" y="175" width="130" height="95" fill="#F8FAFC" stroke="#0A0E17" stroke-width="4"/>
  <rect x="445" y="175" width="130" height="55" fill="#DBEAFE" stroke="#0A0E17" stroke-width="3"/>
  <rect x="445" y="175" width="14" height="95" fill="#DBEAFE" stroke="#0A0E17" stroke-width="2"/>
  <rect x="561" y="175" width="14" height="95" fill="#DBEAFE" stroke="#0A0E17" stroke-width="2"/>
  <line x1="455" y1="230" x2="565" y2="230" stroke="#2563EB" stroke-width="3"/>
  <rect x="470" y="192" width="80" height="18" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="510" y="205" text-anchor="middle" font-size="10" class="small">alias here</text>
  <text x="510" y="300" text-anchor="middle" font-size="13" class="label">COVER · POCKET</text>
  <text x="510" y="325" text-anchor="middle" font-size="12" class="small">hems ~1 cm</text>
  <text x="510" y="348" text-anchor="middle" font-size="12" class="small">dobladillo</text>
  <text x="510" y="370" text-anchor="middle" font-size="12" class="small">no legal name</text>

  <!-- P3: load cards -->
  <text x="764" y="114" font-size="17" class="label">Load 3 cards</text>
  <rect x="775" y="160" width="130" height="50" fill="#DBEAFE" stroke="#0A0E17" stroke-width="3"/>
  <text x="840" y="190" text-anchor="middle" font-size="11" class="small">cover open</text>
  <rect x="775" y="210" width="130" height="90" fill="#F8FAFC" stroke="#0A0E17" stroke-width="4"/>
  <rect x="790" y="220" width="30" height="50" rx="2" fill="#FEF3C7" stroke="#0A0E17" stroke-width="2"/>
  <rect x="830" y="215" width="30" height="50" rx="2" fill="#FDE68A" stroke="#0A0E17" stroke-width="2"/>
  <rect x="870" y="220" width="30" height="50" rx="2" fill="#FEF3C7" stroke="#0A0E17" stroke-width="2"/>
  <line x1="785" y1="250" x2="895" y2="250" stroke="#2563EB" stroke-width="3"/>
  <path d="M840 150 V165" class="arrow"/>
  <text x="840" y="325" text-anchor="middle" font-size="13" class="label">SLIDE IN</text>
  <text x="840" y="348" text-anchor="middle" font-size="12" class="small">taller if needed</text>
  <text x="840" y="370" text-anchor="middle" font-size="12" class="small">close · tuck OK</text>

  <!-- P4: 10-shake -->
  <text x="1094" y="114" font-size="17" class="label">10-shake</text>
  <rect x="1110" y="155" width="120" height="36" rx="18" fill="#2563EB"/>
  <text x="1170" y="179" text-anchor="middle" font-size="14" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-weight="700">10×</text>
  <rect x="1100" y="205" width="140" height="70" fill="#F8FAFC" stroke="#0A0E17" stroke-width="4"/>
  <rect x="1100" y="205" width="140" height="40" fill="#DBEAFE" stroke="#0A0E17" stroke-width="3"/>
  <path d="M1080 230 q-18 -22 0 -44" class="arrow"/>
  <path d="M1260 230 q18 -22 0 -44" class="arrow"/>
  <rect x="1090" y="290" width="160" height="28" rx="8" fill="#FEF3C7" stroke="#0A0E17" stroke-width="2"/>
  <text x="1170" y="309" text-anchor="middle" font-size="12" class="label">PROVE FIRST</text>
  <text x="1170" y="340" text-anchor="middle" font-size="12" class="small">over DESK</text>
  <text x="1170" y="360" text-anchor="middle" font-size="12" class="small">pass = 3 stay</text>
  <text x="1170" y="380" text-anchor="middle" font-size="11" class="small">slip · flap · shallow</text>

  <!-- P5: one change retest -->
  <text x="1424" y="114" font-size="17" class="label">One change</text>
  <rect x="1420" y="155" width="70" height="70" rx="8" fill="#EEF2F7" stroke="#2563EB" stroke-width="2"/>
  <text x="1455" y="185" text-anchor="middle" font-size="10" class="label">deeper</text>
  <text x="1455" y="202" text-anchor="middle" font-size="10" class="label">pocket</text>
  <text x="1500" y="195" text-anchor="middle" font-size="12" class="label" fill="#2563EB" style="fill:#2563EB">OR</text>
  <rect x="1515" y="155" width="70" height="70" rx="8" fill="#EEF2F7" stroke="#2563EB" stroke-width="2"/>
  <text x="1550" y="185" text-anchor="middle" font-size="10" class="label">tighter</text>
  <text x="1550" y="202" text-anchor="middle" font-size="10" class="label">hems</text>
  <rect x="1435" y="240" width="150" height="55" fill="#F8FAFC" stroke="#0A0E17" stroke-width="3"/>
  <rect x="1435" y="240" width="150" height="28" fill="#DBEAFE" stroke="#0A0E17" stroke-width="2"/>
  <text x="1510" y="259" text-anchor="middle" font-size="10" class="small">alias</text>
  <rect x="1445" y="310" width="130" height="28" rx="14" fill="#2563EB"/>
  <text x="1510" y="329" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-weight="700">SHAKE 10</text>
  <text x="1510" y="360" text-anchor="middle" font-size="12" class="small">opens · no tape</text>
  <text x="1510" y="380" text-anchor="middle" font-size="12" class="small">retest prove</text>

  <text x="840" y="420" text-anchor="middle" font-size="15" class="small">Billfold silhouette 1→5 · dashed = valley · fat labels · prove on D4 · alias after on D5</text>
</svg>
