<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Pocket, cover, sides</title>
<desc>Fold the bottom up for a pocket. Fold the top down for a cover. Fold each side in a little.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<text x="140" y="40" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">1  Pocket</text>
<rect x="50" y="80" width="160" height="250" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<rect x="50" y="220" width="160" height="110" fill="#f3eee4" stroke="#1c1915" stroke-width="4"/>
<line x1="130" y1="300" x2="130" y2="230" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="400" y="40" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">2  Cover</text>
<rect x="310" y="80" width="160" height="250" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<rect x="310" y="80" width="160" height="90" fill="#f3eee4" stroke="#1c1915" stroke-width="4"/>
<line x1="390" y1="100" x2="390" y2="160" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="650" y="40" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">3  Sides in</text>
<rect x="560" y="80" width="160" height="250" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<rect x="560" y="80" width="22" height="250" fill="#f3eee4" stroke="#111" stroke-width="3"/>
<rect x="698" y="80" width="22" height="250" fill="#f3eee4" stroke="#111" stroke-width="3"/>
<line x1="545" y1="200" x2="575" y2="200" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="745" y1="200" x2="710" y2="200" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
