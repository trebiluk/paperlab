<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">Step 2: Bottom pocket, top cover, and side hems</title>
  <desc id="desc">Fold bottom third up for a pocket. Fold top third down as a cover. Fold each side edge in about 1 cm (hem) so cards cannot slide. Alias placeholder on cover — no legal name.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .label { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#0A0E17; }
      .small { font-family:Arial,Helvetica,sans-serif; font-weight:600; fill:#475569; }
      .crease { stroke:#0A0E17; stroke-width:4; stroke-dasharray:11 9; opacity:.75; stroke-linecap:round; fill:none; }
      .arrow { stroke:#2563EB; stroke-width:7; stroke-linecap:round; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="620" fill="#EEF2F7"/>
  <circle cx="88" cy="76" r="30" fill="#2563EB"/>
  <text x="88" y="88" text-anchor="middle" font-size="30" class="label" fill="#FFFFFF" style="fill:#FFFFFF">2</text>
  <text x="132" y="82" font-size="28" class="label">Bottom pocket · top cover · side hems</text>
  <text x="132" y="108" font-size="16" class="small">Bottom third up · top third down · ~1 cm hems · alias later</text>
  <rect x="56" y="126" width="688" height="410" rx="24" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="3"/>

  <!-- Billfold body after thirds: W240 H ~107 (1/3 of 320) + hems shown as side bands -->
  <!-- Outer silhouette after hems folded: closed wallet view -->
  <!-- Ghost of open thirds for context -->
  <rect x="280" y="155" width="240" height="100" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" opacity="0.6"/>
  <text x="400" y="175" text-anchor="middle" font-size="12" class="small">top third was here</text>

  <!-- Middle panel (body) -->
  <rect x="280" y="255" width="240" height="110" fill="#F8FAFC" stroke="#0A0E17" stroke-width="5" stroke-linejoin="round"/>

  <!-- COVER folded down (top third) — tint flap -->
  <rect x="280" y="255" width="240" height="95" fill="#DBEAFE" stroke="#0A0E17" stroke-width="5" stroke-linejoin="round" opacity="0.95"/>
  <line x1="280" y1="255" x2="520" y2="255" class="crease"/>

  <!-- POCKET folded up from bottom — overlapping lower body -->
  <rect x="280" y="300" width="240" height="95" fill="#F8FAFC" stroke="#0A0E17" stroke-width="5" stroke-linejoin="round"/>
  <line x1="280" y1="395" x2="520" y2="395" stroke="#0A0E17" stroke-width="5"/>
  <!-- pocket lip -->
  <line x1="288" y1="300" x2="512" y2="300" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>

  <!-- Side hems (~1 cm) — left and right inward bands -->
  <rect x="280" y="255" width="22" height="140" fill="#DBEAFE" stroke="#0A0E17" stroke-width="3" opacity="0.9"/>
  <rect x="498" y="255" width="22" height="140" fill="#DBEAFE" stroke="#0A0E17" stroke-width="3" opacity="0.9"/>

  <!-- COVER label -->
  <rect x="330" y="268" width="140" height="36" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
  <text x="400" y="293" text-anchor="middle" font-size="16" class="label" fill="#2563EB" style="fill:#2563EB">COVER</text>

  <!-- Alias placeholder on cover (not legal name) -->
  <rect x="340" y="308" width="120" height="28" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="400" y="327" text-anchor="middle" font-size="12" class="small">alias here</text>

  <!-- POCKET label -->
  <rect x="330" y="340" width="140" height="40" rx="10" fill="#FFFFFF" stroke="#0A0E17" stroke-width="3"/>
  <text x="400" y="360" text-anchor="middle" font-size="16" class="label">POCKET</text>
  <text x="400" y="376" text-anchor="middle" font-size="11" class="small">bolsillo</text>

  <!-- Hem arrows + labels -->
  <path d="M250 320 H278" class="arrow"/>
  <path d="M550 320 H522" class="arrow"/>
  <rect x="70" y="285" width="120" height="70" rx="12" fill="#DBEAFE" stroke="#0A0E17" stroke-width="3"/>
  <text x="130" y="315" text-anchor="middle" font-size="14" class="label">HEM</text>
  <text x="130" y="335" text-anchor="middle" font-size="12" class="small">~1 cm in</text>
  <text x="130" y="352" text-anchor="middle" font-size="11" class="small">dobladillo</text>

  <rect x="610" y="285" width="120" height="70" rx="12" fill="#DBEAFE" stroke="#0A0E17" stroke-width="3"/>
  <text x="670" y="315" text-anchor="middle" font-size="14" class="label">HEM</text>
  <text x="670" y="335" text-anchor="middle" font-size="12" class="small">cards stay</text>
  <text x="670" y="352" text-anchor="middle" font-size="11" class="small">no side slip</text>

  <!-- Fold direction arrows -->
  <path d="M400 200 V248" class="arrow"/>
  <text x="470" y="230" font-size="13" class="label" fill="#2563EB" style="fill:#2563EB">FOLD DOWN</text>
  <path d="M400 450 V400" class="arrow"/>
  <text x="470" y="440" font-size="13" class="label" fill="#2563EB" style="fill:#2563EB">FOLD UP</text>

  <text x="400" y="510" text-anchor="middle" font-size="14" class="small">Press hard · hems keep cards in · no tape</text>
  <text x="400" y="575" text-anchor="middle" font-size="17" class="label">POCKET + COVER + HEMS · alias placeholder only</text>
</svg>
