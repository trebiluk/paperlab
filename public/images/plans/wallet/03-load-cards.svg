<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Three cards</title>
<desc>Slide three scrap cards into the pocket. Close the cover.</desc>
<rect width="800" height="520" fill="#ffffff"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
  </marker>
</defs>
<rect x="220" y="70" width="360" height="300" fill="#fffdf6" stroke="#111111" stroke-width="4"/>
<rect x="250" y="200" width="300" height="150" fill="#f3eee4" stroke="#111" stroke-width="4"/>
<rect x="280" y="120" width="90" height="50" fill="#fff" stroke="#111" stroke-width="3"/>
<rect x="310" y="145" width="90" height="50" fill="#fff" stroke="#111" stroke-width="3"/>
<rect x="340" y="170" width="90" height="50" fill="#fff" stroke="#111" stroke-width="3"/>
<line x1="385" y1="110" x2="385" y2="190" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="400" y="450" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">three scrap cards, then close the cover</text>
</svg>
