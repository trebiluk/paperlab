<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>One change</title>
<desc>Change one thing: a deeper pocket or tighter sides. Shake ten times again.</desc>
<rect width="800" height="520" fill="#ffffff"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
  </marker>
</defs>
<text x="220" y="50" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">deeper pocket</text>
<rect x="80" y="90" width="200" height="260" fill="#fffdf6" stroke="#111111" stroke-width="4"/>
<rect x="80" y="200" width="200" height="150" fill="#f3eee4" stroke="#111" stroke-width="4"/>
<text x="560" y="50" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">or tighter sides</text>
<rect x="450" y="90" width="200" height="260" fill="#fffdf6" stroke="#111111" stroke-width="4"/>
<rect x="450" y="90" width="36" height="260" fill="#f3eee4" stroke="#111" stroke-width="4"/>
<rect x="614" y="90" width="36" height="260" fill="#f3eee4" stroke="#111" stroke-width="4"/>
<text x="400" y="430" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">one change only, then shake ten again</text>
</svg>
