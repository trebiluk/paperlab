<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>The beam</title>
<desc>Fold a long stiff strip and mark the middle.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="120" y="230" width="560" height="28" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<line x1="400" y1="200" x2="400" y2="290" stroke="#1c1915" stroke-width="3" stroke-linecap="round"/>
<text x="400" y="380" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">a stiff strip. Mark the exact middle</text>
</svg>
