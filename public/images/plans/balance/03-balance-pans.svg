<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Pans</title>
<desc>Tape a small folded square at each end, the same way.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="140" y="210" width="520" height="20" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="120" y="160" width="70" height="50" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/>
<rect x="610" y="160" width="70" height="50" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="360" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">a small square at each end</text>
</svg>
