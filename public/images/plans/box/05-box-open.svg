<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Open two flaps</title>
<desc>Unfold the top corner and the bottom corner. Leave the side corners in.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="250" y="140" width="300" height="220" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="250" y="40" width="150" height="100" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/>
<rect x="400" y="40" width="150" height="100" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/>
<rect x="250" y="360" width="150" height="100" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/>
<rect x="400" y="360" width="150" height="100" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="490" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">unfold only the top flap and the bottom flap</text>
</svg>
