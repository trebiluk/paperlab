<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Corners in</title>
<desc>Fold all four corners to the center.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="200" y="70" width="400" height="300" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<line x1="230" y1="100" x2="370" y2="190" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="570" y1="100" x2="430" y2="190" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="230" y1="340" x2="370" y2="250" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="570" y1="340" x2="430" y2="250" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="300" y="160" width="200" height="150" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="470" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">all four corners to the middle</text>
</svg>
