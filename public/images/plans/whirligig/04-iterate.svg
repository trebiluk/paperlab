<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Two pictures</title>
<desc>A picture on each face. Spin.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<circle cx="300" cy="210" r="80" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<circle cx="500" cy="210" r="80" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/>
<text x="300" y="215" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">bird</text>
<text x="500" y="215" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">cage</text>
<text x="400" y="400" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">spin. Do they become one?</text>
</svg>
