  </marker>
</defs>
<rect x="200" y="100" width="180" height="260" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="380" y="100" width="180" height="260" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/>
