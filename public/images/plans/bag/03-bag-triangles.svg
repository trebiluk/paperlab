<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Bottom triangles</title><desc>Push the sides of the tube in so two triangles show at the bottom.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/></marker></defs>
<text x="150" y="40" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">Tube</text>
<polygon points="80,120 220,120 220,280 80,280" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<line x1="250" y1="200" x2="310" y2="200" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="420" y="40" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">Push both sides in</text>
<polygon points="340,140 500,140 500,240 340,240" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<polygon points="340,240 390,320 450,320 500,240" fill="#e7f3ee" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<text x="400" y="460" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">two triangles at the bottom</text>
</svg>
