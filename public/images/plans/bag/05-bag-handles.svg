<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Handles</title>
<desc>Glue a strip loop on each side, inside the rim.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="260" y="140" width="280" height="220" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<polygon points="280,140 340,80 360,140" fill="none" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<polygon points="440,140 500,80 520,140" fill="none" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<text x="400" y="430" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">two loops inside the rim</text>
</svg>
