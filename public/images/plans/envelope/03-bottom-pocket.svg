<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">Step 3: Bottom pocket</title>
  <desc id="desc">Sides already folded in. Bottom flap folds UP to form the pocket. Bold POCKET LIP. Pointed top flap still waiting UP with clear V tip.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .label { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#0A0E17; }
      .small { font-family:Arial,Helvetica,sans-serif; font-weight:600; fill:#475569; }
      .crease { stroke:#0A0E17; stroke-width:4; stroke-dasharray:11 9; opacity:.68; stroke-linecap:round; fill:none; }
      .arrow { stroke:#2563EB; stroke-width:8; stroke-linecap:round; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="620" fill="#EEF2F7"/>
  <circle cx="88" cy="76" r="30" fill="#2563EB"/>
  <text x="88" y="88" text-anchor="middle" font-size="30" class="label" fill="#FFFFFF" style="fill:#FFFFFF">3</text>
  <text x="132" y="82" font-size="32" class="label">Bottom pocket</text>
  <text x="132" y="108" font-size="16" class="small">Sides in · fold bottom UP · pointed top still waiting</text>
  <rect x="56" y="126" width="688" height="410" rx="24" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="3"/>

  <!-- POINTTED TOP still up (narrow packet after sides in) -->
  <polygon points="270,250 530,250 400,120" fill="#DBEAFE" stroke="#0A0E17" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="400" cy="120" r="7" fill="#2563EB"/>
  <text x="400" y="185" text-anchor="middle" font-size="16" class="label">POINTED TOP</text>
  <text x="400" y="205" text-anchor="middle" font-size="13" class="small">waiting · still up</text>

  <!-- Packet body (sides folded — slight side triangle hints on back edge) -->
  <rect x="270" y="250" width="260" height="160" fill="#FFFFFF" stroke="#0A0E17" stroke-width="5"/>
  <!-- Side fold hints (triangle geometry under) -->
  <polygon points="270,250 285,330 270,410" fill="#DBEAFE" opacity="0.45"/>
  <polygon points="530,250 515,330 530,410" fill="#DBEAFE" opacity="0.45"/>
  <line x1="285" y1="250" x2="285" y2="410" stroke="#CBD5E1" stroke-width="3"/>
  <line x1="515" y1="250" x2="515" y2="410" stroke="#CBD5E1" stroke-width="3"/>
  <text x="400" y="320" text-anchor="middle" font-size="22" class="label">NOTE</text>
  <text x="400" y="345" text-anchor="middle" font-size="13" class="small">sides already folded in</text>

  <!-- BOTTOM flap folding up -->
  <polygon points="270,410 530,410 505,520 295,520" fill="#DBEAFE" stroke="#0A0E17" stroke-width="5" stroke-linejoin="round"/>
  <line x1="270" y1="410" x2="530" y2="410" class="crease"/>

  <!-- Press marks on crease -->
  <g stroke="#0A0E17" stroke-width="3" stroke-linecap="round">
    <line x1="388" y1="398" x2="400" y2="422"/>
    <line x1="400" y1="398" x2="412" y2="422"/>
    <line x1="412" y1="398" x2="424" y2="422"/>
  </g>

  <!-- POCKET LIP bold -->
  <line x1="278" y1="410" x2="522" y2="410" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
  <text x="400" y="392" text-anchor="middle" font-size="18" class="label" fill="#2563EB" style="fill:#2563EB">POCKET LIP</text>

  <!-- Up arrow -->
  <path d="M400 500 V425" class="arrow"/>
  <text x="400" y="545" text-anchor="middle" font-size="16" class="label">FOLD UP (valley)</text>

  <text x="400" y="580" text-anchor="middle" font-size="18" class="label">Crease · fold up · POCKET LIP clear · pointed top still up</text>
</svg>
