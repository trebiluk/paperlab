<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">Step 4: Tuck lock</title>
  <desc id="desc">The top flap moves downward into the bottom pocket. A bold arrow and labels make the tuck lock explicit.</desc>
  <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
      </marker>
      <marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0E17"/>
      </marker>
      <style>
        .ink { fill:#0A0E17; }
        .label { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#0A0E17; }
        .small { font-family:Arial,Helvetica,sans-serif; font-weight:600; fill:#475569; }
        .line { stroke:#0A0E17; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
        .crease { stroke:#0A0E17; stroke-width:4; stroke-dasharray:11 9; opacity:.68; stroke-linecap:round; }
        .arrow { stroke:#2563EB; stroke-width:8; stroke-linecap:round; fill:none; marker-end:url(#arrow); }
      </style>
    </defs>
  <rect x="0" y="0" width="800" height="620" fill="#EEF2F7"/>
  
  <circle cx="88" cy="76" r="30" fill="#2563EB"/>
  <text x="88" y="88" text-anchor="middle" font-size="30" class="label" fill="#FFFFFF" style="fill:#FFFFFF">4</text>
  <text x="132" y="82" font-size="32" class="label">Tuck lock</text>
  <text x="132" y="108" font-size="16" class="small">Tuck the top flap into the bottom pocket. That is the lock.</text>
  <rect x="56" y="126" width="688" height="410" rx="24" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="3"/>

  <rect x="158" y="188" width="484" height="278" rx="8" fill="#F8FAFC" class="line"/>
  <path d="M158 466 L282 412 L518 412 L642 466 Z" fill="#DBEAFE" class="line"/>
  <path d="M282 412 H518" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
  <text x="400" y="397" text-anchor="middle" font-size="20" class="label">BOTTOM POCKET</text>
  <path d="M282 188 H518 L482 296 H318 Z" fill="#FFFFFF" class="line"/>
  <line x1="282" y1="188" x2="518" y2="188" class="crease"/>
  <text x="400" y="244" text-anchor="middle" font-size="24" class="label">TOP FLAP</text>
  <path d="M400 267 C400 307 400 341 400 385" class="arrow"/>
  <path d="M365 360 Q400 380 435 360" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
  <text x="400" y="492" text-anchor="middle" font-size="21" class="label">tuck / meter</text>
  <text x="400" y="522" text-anchor="middle" font-size="17" class="small">top flap goes into bottom pocket</text>
  <text x="400" y="580" text-anchor="middle" font-size="22" class="label">Tuck it in firmly — the pocket is the lock</text>

</svg>
