<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="440" viewBox="0 0 1680 440" role="img" aria-labelledby="title desc">
  <title id="title">PaperLab envelope: five steps — pointed top flap</title>
  <desc id="desc">Five-panel strip with pointed banker V top flap visible throughout: flat net, sides in, bottom pocket, tuck lock, shake prove on BACK.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
    </marker>
    <style>
      .label { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#1c1915; }
      .small { font-family:Arial,Helvetica,sans-serif; font-weight:600; fill:#3f3830; }
      .crease { stroke:#1c1915; stroke-width:3; stroke-dasharray:8 6; opacity:.68; stroke-linecap:round; fill:none; }
      .arrow { stroke:#1f5c4e; stroke-width:5; stroke-linecap:round; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="1680" height="440" fill="#fbf8f1"/>
  <text x="56" y="48" font-size="26" class="label">PAPERLAB ENVELOPE — POINTED TOP (REGULAR / BIRTHDAY-CARD)</text>
  <text x="1624" y="48" text-anchor="end" font-size="16" class="small">Diego LOCK · banker V throughout</text>

  <rect x="32" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#d9d0c2" stroke-width="3"/>
  <rect x="362" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#d9d0c2" stroke-width="3"/>
  <rect x="692" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#d9d0c2" stroke-width="3"/>
  <rect x="1022" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#d9d0c2" stroke-width="3"/>
  <rect x="1352" y="72" width="296" height="330" rx="18" fill="#FFFFFF" stroke="#d9d0c2" stroke-width="3"/>

  <circle cx="66" cy="108" r="25" fill="#1f5c4e"/><text x="66" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">1</text>
  <circle cx="396" cy="108" r="25" fill="#1f5c4e"/><text x="396" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">2</text>
  <circle cx="726" cy="108" r="25" fill="#1f5c4e"/><text x="726" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">3</text>
  <circle cx="1056" cy="108" r="25" fill="#1f5c4e"/><text x="1056" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">4</text>
  <circle cx="1386" cy="108" r="25" fill="#1f5c4e"/><text x="1386" y="117" text-anchor="middle" font-size="24" class="label" style="fill:#FFFFFF">5</text>

  <!-- P1: flat net pointed -->
  <text x="104" y="114" font-size="18" class="label">Flat net</text>
  <rect x="100" y="175" width="120" height="80" fill="#fffdf8" stroke="#1c1915" stroke-width="3"/>
  <polygon points="100,175 220,175 160,120" fill="#d7ebe3" stroke="#1c1915" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="100,175 55,215 100,255" fill="#d7ebe3" stroke="#1c1915" stroke-width="2"/>
  <polygon points="220,175 265,215 220,255" fill="#d7ebe3" stroke="#1c1915" stroke-width="2"/>
  <polygon points="100,255 220,255 205,310 115,310" fill="#d7ebe3" stroke="#1c1915" stroke-width="2"/>
  <circle cx="160" cy="120" r="5" fill="#1f5c4e"/>
  <text x="160" y="220" text-anchor="middle" font-size="12" class="label">NOTE</text>
  <text x="160" y="340" text-anchor="middle" font-size="13" class="label">pointed top V</text>
  <text x="160" y="360" text-anchor="middle" font-size="12" class="small">L·R·bottom flaps</text>

  <!-- P2: sides in, pointed up -->
  <text x="434" y="114" font-size="18" class="label">Sides in</text>
  <rect x="430" y="175" width="120" height="90" fill="#fffdf8" stroke="#1c1915" stroke-width="3"/>
  <polygon points="430,175 550,175 490,120" fill="#d7ebe3" stroke="#1c1915" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="490" cy="120" r="5" fill="#1f5c4e"/>
  <path d="M415 220 H435" class="arrow"/>
  <path d="M565 220 H545" class="arrow"/>
  <text x="490" y="225" text-anchor="middle" font-size="12" class="label">NOTE</text>
  <text x="490" y="340" text-anchor="middle" font-size="13" class="label">FOLD IN · Δ sides</text>
  <text x="490" y="360" text-anchor="middle" font-size="12" class="small">top pointed up</text>

  <!-- P3: pocket, pointed up -->
  <text x="764" y="114" font-size="18" class="label">Bottom pocket</text>
  <polygon points="760,175 880,175 820,120" fill="#d7ebe3" stroke="#1c1915" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="820" cy="120" r="5" fill="#1f5c4e"/>
  <rect x="760" y="175" width="120" height="70" fill="#FFFFFF" stroke="#1c1915" stroke-width="3"/>
  <rect x="760" y="245" width="120" height="50" fill="#d7ebe3" stroke="#1c1915" stroke-width="3"/>
  <line x1="765" y1="245" x2="875" y2="245" stroke="#1f5c4e" stroke-width="5" stroke-linecap="round"/>
  <path d="M820 285 V255" class="arrow"/>
  <text x="820" y="215" text-anchor="middle" font-size="12" class="label">NOTE</text>
  <text x="820" y="240" text-anchor="middle" font-size="10" class="label" fill="#1f5c4e" style="fill:#1f5c4e">LIP</text>
  <text x="820" y="340" text-anchor="middle" font-size="13" class="label">FOLD UP · LIP</text>
  <text x="820" y="360" text-anchor="middle" font-size="12" class="small">pointed still up</text>

  <!-- P4: tuck pointed down -->
  <text x="1094" y="114" font-size="18" class="label">Tuck lock</text>
  <polygon points="1090,175 1210,175 1150,120" fill="#FFFFFF" stroke="#1c1915" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="1150" cy="120" r="5" fill="#1f5c4e"/>
  <rect x="1090" y="175" width="120" height="100" fill="#fffdf8" stroke="#1c1915" stroke-width="3"/>
  <rect x="1090" y="205" width="120" height="70" fill="#d7ebe3" stroke="#1c1915" stroke-width="3"/>
  <line x1="1095" y1="205" x2="1205" y2="205" stroke="#1f5c4e" stroke-width="5"/>
  <polyline points="1115,205 1150,240 1185,205" fill="none" stroke="#1c1915" stroke-width="2" stroke-dasharray="5 4" opacity=".55"/>
  <path d="M1150 160 V195" class="arrow"/>
  <text x="1150" y="340" text-anchor="middle" font-size="13" class="label">FOLD DOWN · TUCK</text>
  <text x="1150" y="360" text-anchor="middle" font-size="12" class="small">V tip under lip</text>

  <!-- P5: BACK pointed sealed -->
  <text x="1424" y="114" font-size="18" class="label">Shake · BACK</text>
  <rect x="1435" y="155" width="130" height="120" fill="#fffdf8" stroke="#1c1915" stroke-width="3"/>
  <polygon points="1435,155 1500,210 1565,155" fill="#d7ebe3" opacity=".5"/>
  <polygon points="1435,155 1565,155 1500,240" fill="#FFFFFF" stroke="#1c1915" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="1500" cy="240" r="4" fill="#1f5c4e"/>
  <text x="1500" y="195" text-anchor="middle" font-size="12" class="label">POINTED</text>
  <path d="M1415 200 q-12 -16 0 -32" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1585 200 q12 -16 0 -32" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="1500" y="340" text-anchor="middle" font-size="13" class="label">10× shake</text>
  <text x="1500" y="360" text-anchor="middle" font-size="12" class="small">seal on BACK</text>

  <text x="840" y="420" text-anchor="middle" font-size="15" class="small">Pointed top flap in every panel · blue = fold · dashed = crease · front stays plain rect</text>
</svg>
