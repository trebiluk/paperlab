<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">Step 2: Side flaps first</title>
  <desc id="desc">Left and right flaps fold inward first, with arrows and dashed crease lines. The note remains snug in the center.</desc>
  <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
      </marker>
      <marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0E17"/>
      </marker>
      <style>
        .ink { fill:#0A0E17; }
        .label { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#0A0E17; }
        .small { font-family:Arial,Helvetica,sans-serif; font-weight:600; fill:#475569; }
        .line { stroke:#0A0E17; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
        .crease { stroke:#0A0E17; stroke-width:4; stroke-dasharray:11 9; opacity:.68; stroke-linecap:round; }
        .arrow { stroke:#2563EB; stroke-width:8; stroke-linecap:round; fill:none; marker-end:url(#arrow); }
      </style>
    </defs>
  <rect x="0" y="0" width="800" height="620" fill="#EEF2F7"/>
  
  <circle cx="88" cy="76" r="30" fill="#2563EB"/>
  <text x="88" y="88" text-anchor="middle" font-size="30" class="label" fill="#FFFFFF" style="fill:#FFFFFF">2</text>
  <text x="132" y="82" font-size="32" class="label">Side flaps first</text>
  <text x="132" y="108" font-size="16" class="small">Fold the left and right sides in before the bottom pocket.</text>
  <rect x="56" y="126" width="688" height="410" rx="24" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="3"/>

  <rect x="158" y="178" width="484" height="280" rx="8" fill="#F8FAFC" class="line"/>
  <path d="M158 178 L282 230 L282 406 L158 458 Z" fill="#DBEAFE" class="line"/>
  <path d="M642 178 L518 230 L518 406 L642 458 Z" fill="#DBEAFE" class="line"/>
  <rect x="286" y="244" width="228" height="122" rx="8" fill="#FFFFFF" stroke="#0A0E17" stroke-width="5"/>
  <text x="400" y="296" text-anchor="middle" font-size="25" class="label">NOTE</text>
  <text x="400" y="330" text-anchor="middle" font-size="17" class="small">snug against the note</text>
  <path d="M244 218 C258 238 267 255 278 278" class="arrow"/>
  <path d="M556 218 C542 238 533 255 522 278" class="arrow"/>
  <line x1="282" y1="230" x2="282" y2="406" class="crease"/>
  <line x1="518" y1="230" x2="518" y2="406" class="crease"/>
  <text x="212" y="212" font-size="19" class="label">LEFT IN</text>
  <text x="588" y="212" font-size="19" class="label">RIGHT IN</text>
  <text x="400" y="424" text-anchor="middle" font-size="19" class="small">fold / doblar</text>
  <text x="400" y="580" text-anchor="middle" font-size="22" class="label">Side flaps first — crease against the note</text>

</svg>
