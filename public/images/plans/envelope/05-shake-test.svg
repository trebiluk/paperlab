<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">Diagram 5: Shake test</title>
  <desc id="desc">Hold the closed envelope at the same height. Shake ten times. Pass if the note stays in. Then write your alias on the front.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .label { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#0A0E17; }
      .small { font-family:Arial,Helvetica,sans-serif; font-weight:600; fill:#475569; }
      .line { stroke:#0A0E17; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; fill:#F8FAFC; }
    </style>
  </defs>
  <circle cx="88" cy="76" r="30" fill="#2563EB"/>
  <text x="88" y="88" text-anchor="middle" font-size="30" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-weight="700">5</text>
  <text x="132" y="82" font-size="32" class="label">Shake test</text>
  <text x="132" y="108" font-size="16" class="small">Ten shakes · same height · note must stay in · then alias on front</text>
  <rect x="56" y="126" width="688" height="410" rx="24" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="3"/>

  <!-- closed envelope -->
  <g transform="translate(250,200)">
    <rect x="0" y="40" width="300" height="200" rx="8" fill="#F8FAFC" stroke="#0A0E17" stroke-width="5"/>
    <path d="M0 40 L150 140 L300 40" fill="#DBEAFE" stroke="#0A0E17" stroke-width="5"/>
    <path d="M0 40 L150 140 L300 40" fill="none" stroke="#0A0E17" stroke-width="5"/>
    <text x="150" y="178" text-anchor="middle" font-size="22" class="label">ALIAS</text>
    <line x1="70" y1="198" x2="230" y2="198" stroke="#0A0E17" stroke-width="5" stroke-linecap="round"/>
    <text x="150" y="222" text-anchor="middle" font-size="14" class="small">no legal name</text>
  </g>

  <!-- shake motion arrows -->
  <path d="M200 280 q-28 -36 0 -72" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M200 340 q-28 36 0 72" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M600 280 q28 -36 0 -72" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M600 340 q28 36 0 72" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="300" y="148" width="200" height="56" rx="28" fill="#2563EB"/>
  <text x="400" y="186" text-anchor="middle" font-size="28" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-weight="700">10× SHAKE</text>

  <text x="400" y="480" text-anchor="middle" font-size="20" class="label">Pass = note stays · Fail = change ONE fold · test again</text>
  <text x="400" y="580" text-anchor="middle" font-size="22" class="label">Shake first · then write alias on the front</text>
</svg>
