<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">Step 5: Name on front</title>
  <desc id="desc">A closed envelope front has a clear Name line on the outside and a 10x shake test reminder.</desc>
  <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
      </marker>
      <marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0E17"/>
      </marker>
      <style>
        .ink { fill:#0A0E17; }
        .label { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#0A0E17; }
        .small { font-family:Arial,Helvetica,sans-serif; font-weight:600; fill:#475569; }
        .line { stroke:#0A0E17; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
        .crease { stroke:#0A0E17; stroke-width:4; stroke-dasharray:11 9; opacity:.68; stroke-linecap:round; }
        .arrow { stroke:#2563EB; stroke-width:8; stroke-linecap:round; fill:none; marker-end:url(#arrow); }
      </style>
    </defs>
  <rect x="0" y="0" width="800" height="620" fill="#EEF2F7"/>
  
  <circle cx="88" cy="76" r="30" fill="#2563EB"/>
  <text x="88" y="88" text-anchor="middle" font-size="30" class="label" fill="#FFFFFF" style="fill:#FFFFFF">5</text>
  <text x="132" y="82" font-size="32" class="label">Name on front</text>
  <text x="132" y="108" font-size="16" class="small">Finish outside: write the name, then do the ten-shake test.</text>
  <rect x="56" y="126" width="688" height="410" rx="24" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="3"/>

  <rect x="158" y="162" width="484" height="316" rx="10" fill="#F8FAFC" class="line"/>
  <path d="M160 164 L400 332 L640 164" fill="#DBEAFE" class="line"/>
  <path d="M160 476 L338 318" stroke="#0A0E17" stroke-width="5" fill="none"/>
  <path d="M640 476 L462 318" stroke="#0A0E17" stroke-width="5" fill="none"/>
  <path d="M160 476 L400 276 L640 476" fill="#FFFFFF" class="line"/>
  <path d="M160 164 L400 332 L640 164" fill="none" class="line"/>
  <text x="400" y="362" text-anchor="middle" font-size="24" class="label">NAME</text>
  <line x1="284" y1="398" x2="516" y2="398" stroke="#0A0E17" stroke-width="6" stroke-linecap="round"/>
  <rect x="202" y="196" width="126" height="48" rx="24" fill="#FEF3C7" stroke="#0A0E17" stroke-width="3"/>
  <text x="265" y="227" text-anchor="middle" font-size="19" class="label">OUTSIDE</text>
  <rect x="522" y="196" width="104" height="48" rx="24" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
  <text x="574" y="227" text-anchor="middle" font-size="19" class="label" fill="#2563EB" style="fill:#2563EB">10× SHAKE</text>
  <path d="M206 277 q-22 22 0 44 M226 277 q-22 22 0 44" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
  <text x="400" y="446" text-anchor="middle" font-size="20" class="small">sealed / sello</text>
  <text x="400" y="580" text-anchor="middle" font-size="22" class="label">Finished: name on the outside</text>

</svg>
