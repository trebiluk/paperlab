<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">Finished: alias on front + pointed back inset</title>
  <desc id="desc">Front address face = plain rectangle with alias. Small back inset shows pointed top seal flap. After shake prove.</desc>
  <defs>
    <style>
      .label { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#1c1915; }
      .small { font-family:Arial,Helvetica,sans-serif; font-weight:600; fill:#3f3830; }
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="620" fill="#fbf8f1"/>
  <circle cx="88" cy="76" r="30" fill="#1f5c4e"/>
  
  
  
  <rect x="56" y="126" width="688" height="410" rx="24" fill="#fbf8f1" stroke="#d9d0c2" stroke-width="3"/>

  <!-- FRONT = plain rectangle -->
  <g transform="translate(160,180)">
    <rect x="0" y="0" width="280" height="200" rx="6" fill="#fffdf8" stroke="#1c1915" stroke-width="5"/>
    
    <line x1="50" y1="110" x2="230" y2="110" stroke="#1c1915" stroke-width="5" stroke-linecap="round"/>
    
    
  </g>
  <rect x="240" y="150" width="90" height="36" rx="18" fill="#FEF3C7" stroke="#1c1915" stroke-width="3"/>
  

  <!-- BACK inset with pointed flap -->
  <g transform="translate(500,175)">
    <rect x="-10" y="-10" width="200" height="230" rx="12" fill="#FFFFFF" stroke="#d9d0c2" stroke-width="3"/>
    
    <rect x="10" y="40" width="160" height="140" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
    <polygon points="10,40 90,90 170,40" fill="none" stroke="#d9d0c2" stroke-width="2"/>
    <polygon points="10,40 170,40 90,145" fill="#FFFFFF" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="90" cy="145" r="5" fill="#1f5c4e"/>
    
    
    
  </g>

  <rect x="540" y="150" width="110" height="36" rx="18" fill="#FFFFFF" stroke="#1f5c4e" stroke-width="4"/>
  

  
  
</svg>
