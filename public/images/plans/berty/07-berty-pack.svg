<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Fold flat, then stand</title><desc>Fold the legs flat, then open them so Berty stands again.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/></marker></defs>
<text x="220" y="50" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">Flat</text><rect x="80" y="90" width="280" height="160" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><rect x="80" y="90" width="280" height="36" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/><rect x="40" y="140" width="40" height="16" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><rect x="360" y="140" width="40" height="16" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><line x1="430" y1="180" x2="500" y2="180" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><text x="620" y="50" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">Stands again</text><rect x="540" y="80" width="160" height="130" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><rect x="540" y="80" width="160" height="28" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/><circle cx="590" cy="95" r="4" fill="#1c1915"/><circle cx="650" cy="95" r="4" fill="#1c1915"/><polygon points="540,210 570,250 540,280" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/><polygon points="700,210 670,250 700,280" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
</svg>
