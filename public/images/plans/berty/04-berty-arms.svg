<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Two arms</title><desc>Cut the strip into two arms and slide them under the head.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/></marker></defs>
<rect x="250" y="150" width="300" height="200" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><rect x="250" y="150" width="300" height="50" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/><rect x="80" y="175" width="150" height="28" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><rect x="570" y="175" width="150" height="28" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><line x1="200" y1="189" x2="250" y2="189" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><line x1="600" y1="189" x2="550" y2="189" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><text x="400" y="430" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">one arm under each side of the head</text>
</svg>
