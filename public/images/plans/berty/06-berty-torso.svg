<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Fold the body, then the head</title><desc>Fold the body on the dashed line. Glue the head on top of it.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/></marker></defs>
<text x="190" y="48" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">1. Fold</text><rect x="70" y="160" width="240" height="160" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><line x1="70" y1="240" x2="310" y2="240" stroke="#1f5c4e" stroke-width="4" stroke-dasharray="10 7"/><line x1="190" y1="120" x2="190" y2="200" stroke="#1f5c4e" stroke-width="4" marker-end="url(#arr)"/><text x="520" y="48" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">2. Glue the head on</text><rect x="400" y="230" width="240" height="90" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><rect x="440" y="70" width="160" height="160" fill="#f3efe4" stroke="#1c1915" stroke-width="4"/><rect x="462.0" y="92.0" width="16.0" height="16.0" fill="#fffdf8"/><rect x="482.0" y="92.0" width="16.0" height="16.0" fill="#fffdf8"/><rect x="542.0" y="92.0" width="16.0" height="16.0" fill="#fffdf8"/><rect x="562.0" y="92.0" width="16.0" height="16.0" fill="#fffdf8"/><rect x="462.0" y="112.0" width="16.0" height="16.0" fill="#fffdf8"/><rect x="482.0" y="112.0" width="16.0" height="16.0" fill="#1c1915"/><rect x="542.0" y="112.0" width="16.0" height="16.0" fill="#fffdf8"/><rect x="562.0" y="112.0" width="16.0" height="16.0" fill="#1c1915"/><rect x="462.0" y="172.0" width="16.0" height="16.0" fill="#1c1915"/><rect x="562.0" y="172.0" width="16.0" height="16.0" fill="#1c1915"/><rect x="482.0" y="192.0" width="16.0" height="16.0" fill="#1c1915"/><rect x="502.0" y="192.0" width="16.0" height="16.0" fill="#1c1915"/><rect x="522.0" y="192.0" width="16.0" height="16.0" fill="#1c1915"/><rect x="542.0" y="192.0" width="16.0" height="16.0" fill="#1c1915"/><text x="400" y="470" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">the head sits on the body</text>
</svg>
