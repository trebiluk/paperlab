<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Body</title><desc>Fold the body on the dashed line and glue the head on top.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<rect x="300" y="200" width="200" height="120" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><line x1="300" y1="260" x2="500" y2="260" stroke="#1c1915" stroke-width="2.5" stroke-dasharray="8 6"/><polygon points="360,90 470,90 500,130 390,130" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/><text x="400" y="420" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">fold the body. Glue the head on</text>
</svg>
