<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Berty stands</title><desc>Open the legs, draw two eyes, and count to ten.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/></marker></defs>
<rect x="300" y="120" width="200" height="180" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><rect x="300" y="120" width="200" height="48" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/><rect x="120" y="145" width="160" height="26" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><rect x="520" y="145" width="160" height="26" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><circle cx="360" cy="145" r="6" fill="#1c1915"/><circle cx="440" cy="145" r="6" fill="#1c1915"/><polygon points="300,300 360,360 300,400" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/><polygon points="500,300 440,360 500,400" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/><text x="400" y="460" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">hands off. Count to ten</text>
</svg>
