<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/></marker></defs>
<rect x="200" y="140" width="400" height="220" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><rect x="200" y="140" width="400" height="56" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/><line x1="400" y1="100" x2="400" y2="160" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><text x="400" y="430" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">about two fingers. Leave it down</text>
