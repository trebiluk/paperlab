<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Four cuts</title>
<desc>Cut from each corner toward the middle. Stop before the center.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="200" y="70" width="400" height="340" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<line x1="200" y1="70" x2="600" y2="410" fill="none" stroke="#1c1915" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<line x1="600" y1="70" x2="200" y2="410" fill="none" stroke="#1c1915" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<line x1="360" y1="200" x2="440" y2="280" stroke="#1c1915" stroke-width="8" stroke-linecap="round"/>
<text x="400" y="470" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">cut on the dashes. Stop before the middle</text>
</svg>
