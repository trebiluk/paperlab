<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>The pin</title>
<desc>Push a pin through the points into the pencil eraser. Leave a little wiggle.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<polygon points="330,180 470,180 450,300 350,300" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<line x1="400" y1="160" x2="400" y2="400" stroke="#1c1915" stroke-width="6" stroke-linecap="round"/>
<rect x="370" y="390" width="60" height="40" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="460" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">pin through the stack into the eraser. A little loose</text>
</svg>
