<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>A picture</title>
<desc>Glue a small square on the step, not on the walls.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<polygon points="240,160 400,160 400,320 240,320" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<polygon points="400,190 500,160 500,250 400,250" fill="#e7f3ee" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<rect x="430" y="175" width="40" height="40" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="430" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">glue the scrap on the step only</text>
