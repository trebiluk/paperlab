<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Tuck and blow</title>
<desc>Tuck four flaps into the pockets. Blow once. No glue.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<polygon points="200,120 270,240 200,360 130,240" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<line x1="200" y1="160" x2="200" y2="230" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="200" y="420" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">tuck each flap in</text>
<line x1="320" y1="240" x2="430" y2="240" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<polygon points="500,160 640,160 700,210 560,210" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<polygon points="500,160 560,210 560,340 500,290" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<polygon points="560,210 700,210 700,340 560,340" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<text x="600" y="420" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">blow once</text>
</svg>
