<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Tuck and blow</title>
<desc>Tuck the flaps into the pockets. Blow once. No glue.</desc>
<rect width="800" height="520" fill="#ffffff"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
  </marker>
</defs>
<polygon points="180,120 300,220 180,320" fill="#fffdf6" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
<line x1="220" y1="180" x2="230" y2="230" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="240" y="380" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">tuck flaps in</text>
<line x1="340" y1="220" x2="470" y2="220" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<polygon points="520,160 640,160 700,200 580,200" fill="#f3eee4" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
<polygon points="520,160 580,200 580,320 520,280" fill="#fffdf6" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
<polygon points="580,200 700,200 700,320 580,320" fill="#fff" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
<text x="600" y="400" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">blow once</text>
</svg>
