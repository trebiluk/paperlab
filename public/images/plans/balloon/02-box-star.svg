<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Plus and X</title>
<desc>Fold edge to edge both ways and open. Fold corner to corner both ways and open.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<text x="200" y="40" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">plus: edge to edge, both ways</text>
<rect x="80" y="80" width="240" height="240" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<line x1="80" y1="200" x2="320" y2="200" fill="none" stroke="#1c1915" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<line x1="200" y1="80" x2="200" y2="320" fill="none" stroke="#1c1915" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<text x="580" y="40" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">X: corner to corner, both ways</text>
<rect x="450" y="80" width="240" height="240" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<line x1="450" y1="80" x2="690" y2="320" fill="none" stroke="#1c1915" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<line x1="690" y1="80" x2="450" y2="320" fill="none" stroke="#1c1915" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
</svg>
