<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>One change</title>
<desc>Change one thing: a wider bottom or a tighter roll. Test again.</desc>
<rect width="800" height="520" fill="#ffffff"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
  </marker>
</defs>
<rect x="120" y="80" width="140" height="200" fill="#fffdf6" stroke="#111" stroke-width="4"/>
<rect x="80" y="280" width="220" height="36" fill="#f3eee4" stroke="#111" stroke-width="4"/>
<text x="190" y="360" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">wider bottom</text>
<text x="400" y="200" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">or</text>
<rect x="520" y="60" width="56" height="260" fill="#fffdf6" stroke="#111" stroke-width="4"/>
<text x="548" y="360" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">tighter roll</text>
<text x="400" y="450" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">one change, then count to 10 again</text>
</svg>
