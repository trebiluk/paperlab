<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Two ideas</title>
<desc>Draw a tube and a zigzag. Circle the one you will build first.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<text x="200" y="40" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">A  tube</text>
<ellipse cx="200" cy="160" rx="70" ry="28" fill="none" stroke="#1c1915" stroke-width="4"/>
<path d="M130 160 V320" fill="none" stroke="#1c1915" stroke-width="4"/>
<path d="M270 160 V320" fill="none" stroke="#1c1915" stroke-width="4"/>
<ellipse cx="200" cy="320" rx="70" ry="28" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<text x="560" y="40" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">B  zigzag</text>
<polyline points="470,120 560,180 470,240 560,300 470,360" fill="none" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<circle cx="200" cy="400" r="22" fill="none" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="470" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">circle the one you will build</text>
</svg>
