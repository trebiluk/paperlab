<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Make the first one</title>
<desc>Build the idea you circled. Roll a tube tight. Stand it up.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="60" y="140" width="220" height="160" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<line x1="300" y1="220" x2="420" y2="220" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<ellipse cx="560" cy="150" rx="60" ry="24" fill="none" stroke="#1c1915" stroke-width="4"/>
<path d="M500 150 V340" fill="none" stroke="#1c1915" stroke-width="4"/>
<path d="M620 150 V340" fill="none" stroke="#1c1915" stroke-width="4"/>
<ellipse cx="560" cy="340" rx="60" ry="24" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="450" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">roll tight, then stand it up</text>
</svg>
