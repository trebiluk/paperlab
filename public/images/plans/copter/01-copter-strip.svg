<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>The strip</title>
<desc>A long strip, three fingers wide.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<rect x="300" y="40" width="200" height="400" fill="#f4e6c8" stroke="#1c1915" stroke-width="4"/><rect x="80" y="180" width="70" height="28" fill="#d7c4a8" stroke="#1c1915" stroke-width="4"/><rect x="80" y="216" width="70" height="28" fill="#d7c4a8" stroke="#1c1915" stroke-width="4"/><rect x="80" y="252" width="70" height="28" fill="#d7c4a8" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="492" text-anchor="middle" font-size="22" font-family="Georgia, serif" font-weight="700" fill="#1c1915">Three fingers wide. As long as the page.</text>
</svg>
