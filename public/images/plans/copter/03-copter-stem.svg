<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Stem</title>
<desc>Fold the bottom up into a stem.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="340" y="60" width="50" height="180" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="410" y="60" width="50" height="180" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="340" y="240" width="120" height="160" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/>
<line x1="400" y1="420" x2="400" y2="360" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="400" y="470" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">fold the bottom up. That is the stem</text>
</svg>
