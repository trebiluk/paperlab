<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Steep</title>
<desc>A short steep ramp. Let the eraser go.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="80" y="140" width="100" height="90" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<polygon points="180,180 420,300 420,330 180,210" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<rect x="360" y="250" width="40" height="28" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="420" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">short and steep. Did you have to push?</text>
</svg>
