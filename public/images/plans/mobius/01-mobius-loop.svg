<ellipse cx="400" cy="210" rx="160" ry="70" fill="none" stroke="#1c1915" stroke-width="16"/><text x="400" y="380" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">no twist. The line stays on one side</text>
