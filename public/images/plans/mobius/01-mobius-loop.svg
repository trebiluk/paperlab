<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>No twist</title>
<desc>A bracelet with no twist.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<circle cx="400" cy="230" r="100" fill="none" stroke="#1c1915" stroke-width="18"/><line x1="300" y1="230" x2="500" y2="230" stroke="#1f5c4e" stroke-width="4"/>
<text x="400" y="492" text-anchor="middle" font-size="22" font-family="Georgia, serif" font-weight="700" fill="#1c1915">No twist. The line stays on one side.</text>
</svg>
