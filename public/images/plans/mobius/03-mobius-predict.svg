<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Write the guess</title>
<desc>Write the guess before you cut.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<rect x="160" y="160" width="480" height="80" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/><line x1="200" y1="210" x2="600" y2="210" stroke="#1f5c4e" stroke-width="3"/><text x="400" y="300" text-anchor="middle" font-size="26" font-family="Georgia, serif" font-weight="700" fill="#1c1915">I think I will get ______</text>
<text x="400" y="492" text-anchor="middle" font-size="22" font-family="Georgia, serif" font-weight="700" fill="#1c1915">Write it. Then cut.</text>
</svg>
