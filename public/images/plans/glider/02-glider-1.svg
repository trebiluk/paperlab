<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Heavy front</title>
<desc>Fold the top edge down about two fingers, then fold that strip down again.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="220" y="80" width="360" height="300" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="220" y="80" width="360" height="50" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/>
<line x1="400" y1="70" x2="400" y2="120" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="400" y="450" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">fold the top down. Fold that strip down again</text>
</svg>
