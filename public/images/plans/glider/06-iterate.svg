<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>One change</title>
<desc>Wider wings, or a tiny up-bend.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<polygon points="140,240 400,200 140,280" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/><polygon points="400,200 620,160 400,230" fill="#c5e4d8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/><line x1="560" y1="150" x2="640" y2="120" stroke="#1f5c4e" stroke-width="5"/>
<text x="400" y="492" text-anchor="middle" font-size="22" font-family="Georgia, serif" font-weight="700" fill="#1c1915">One change. Then three more flights.</text>
</svg>
