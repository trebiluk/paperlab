<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Strips</title>
<desc>Cut even strips the short way. Eight or more.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="140" y="80" width="80" height="280" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="250" y="80" width="80" height="280" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="360" y="80" width="80" height="280" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<text x="560" y="200" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">eight or more</text>
<text x="400" y="440" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">two fingers wide</text>
</svg>
