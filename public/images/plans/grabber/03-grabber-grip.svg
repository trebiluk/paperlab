<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Lips</title>
<desc>Fold a lip at each tip so the eraser cannot slip.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="200" y="220" width="240" height="24" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="300" y="120" width="22" height="220" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<polygon points="190,230 170,250 200,250" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<polygon points="450,230 480,250 440,250" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<text x="400" y="400" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">a small lip on each tip</text>
</svg>
