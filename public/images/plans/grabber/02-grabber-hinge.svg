<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Hinge</title>
<desc>Cross the arms and fasten them so they scissor.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="180" y="200" width="280" height="28" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="300" y="140" width="28" height="240" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="300" y="230" width="28" height="28" fill="#1c1915" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="430" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">they cross. A fastener through both</text>
</svg>
