<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>The kit</title>
<desc>Six papers, six sticks, one yard of tape. No borrowing.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<text x="400" y="160" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">6 papers</text>
<text x="400" y="230" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">6 sticks</text>
<text x="400" y="300" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">36 inches of tape</text>
</svg>
