<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>One brick</title>
<desc>If the circle hangs free and flat, add one brick. Count to seven.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="80" y="240" width="160" height="30" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<rect x="560" y="240" width="160" height="30" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<polygon points="240,180 320,230 240,280" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<line x1="300" y1="140" x2="500" y2="140" stroke="#1c1915" stroke-width="5" stroke-linecap="round"/>
<rect x="380" y="160" width="40" height="40" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="400" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">free and flat? Then one brick. Count to seven</text>
</svg>
