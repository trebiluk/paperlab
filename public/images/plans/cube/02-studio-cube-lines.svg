<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Cut line and fold line</title>
<desc>A thick line is a cut. A dashed line is a fold. Tabs are for glue.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<text x="200" y="50" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">thick = cut</text>
<rect x="80" y="100" width="240" height="240" fill="none" stroke="#111" stroke-width="8"/>
<text x="560" y="50" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">dashed = fold</text>
<rect x="440" y="100" width="240" height="240" fill="#fffdf6" stroke="#1c1915" stroke-width="4"/>
<line x1="440" y1="220" x2="680" y2="220" fill="none" stroke="#1c1915" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<line x1="560" y1="100" x2="560" y2="340" fill="none" stroke="#1c1915" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<text x="400" y="420" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">a tab on each edge that glues</text>
</svg>
