<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Cut the outline</title>
<desc>Cut the thick outline. Do not cut a dashed line.</desc>
<rect width="800" height="520" fill="#ffffff"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
  </marker>
</defs>
<rect x="160" y="60" width="480" height="300" fill="none" stroke="#111" stroke-width="8"/>
<line x1="300" y1="60" x2="300" y2="360" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<line x1="160" y1="180" x2="640" y2="180" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>
<circle cx="200" cy="100" r="16" fill="none" stroke="#111" stroke-width="3"/>
<text x="200" y="106" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">?</text>
<text x="400" y="440" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">cut the thick line only</text>
<text x="400" y="480" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">do not cut a dashed line</text>
</svg>
