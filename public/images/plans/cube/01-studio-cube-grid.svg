<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Six squares</title>
<desc>Turn the paper tall. Mark six equal squares in a cross.</desc>
<rect width="800" height="520" fill="#ffffff"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
  </marker>
</defs>
<rect x="330" y="40" width="78" height="78" fill="#fffdf6" stroke="#111111" stroke-width="4"/>
<rect x="330" y="118" width="78" height="78" fill="#fffdf6" stroke="#111111" stroke-width="4"/>
<rect x="330" y="196" width="78" height="78" fill="#fffdf6" stroke="#111111" stroke-width="4"/>
<rect x="330" y="274" width="78" height="78" fill="#fffdf6" stroke="#111111" stroke-width="4"/>
<rect x="252" y="118" width="78" height="78" fill="#fffdf6" stroke="#111111" stroke-width="4"/>
<rect x="408" y="118" width="78" height="78" fill="#fffdf6" stroke="#111111" stroke-width="4"/>
<text x="400" y="430" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">six squares in a cross</text>
<text x="400" y="470" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">turn the sheet tall first</text>
</svg>
