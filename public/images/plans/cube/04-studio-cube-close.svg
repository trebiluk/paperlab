<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Fold and close</title>
<desc>Fold every dashed line. Glue each tab inside. Count 6 faces.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<polygon points="80,80 220,80 260,120 120,120" fill="#f3eee4" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<polygon points="80,80 120,120 120,260 80,220" fill="#fffdf6" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<polygon points="120,120 260,120 260,260 120,260" fill="#fff" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<line x1="300" y1="180" x2="420" y2="180" fill="none" stroke="#1f5c4e" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<polygon points="470,100 600,100 650,140 520,140" fill="#f3eee4" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<polygon points="470,100 520,140 520,280 470,240" fill="#fffdf6" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<polygon points="520,140 650,140 650,280 520,280" fill="#fff" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<text x="560" y="400" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">glue the tabs inside</text>
<text x="400" y="470" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1c1915" font-weight="700">count 6 faces</text>
</svg>
