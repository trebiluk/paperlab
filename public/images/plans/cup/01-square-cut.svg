<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
<title>Make a square</title>
<desc>Make a square. Keep the strip as a coaster.</desc>
<rect width="800" height="520" fill="#fbf8f1"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c4e"/>
  </marker>
</defs>
<rect x="80" y="100" width="200" height="260" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<polygon points="80,100 200,100 200,280" fill="#fffdf8" stroke="#1c1915" stroke-width="4" stroke-linejoin="round"/>
<rect x="280" y="100" width="80" height="260" fill="#e7f3ee" stroke="#1c1915" stroke-width="4"/>
<rect x="460" y="140" width="220" height="220" fill="#fffdf8" stroke="#1c1915" stroke-width="4"/>
<text x="400" y="460" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1c1915">open the square</text>
</svg>
